name: Burn Subtitles Batch (Season/Archive)

on:
  workflow_dispatch:
    inputs:
      archive_url:
        description: "Pixeldrain archive URL (7z/zip) with all episode videos"
        required: true
        type: string
      srt_urls:
        description: "Comma-separated raw .srt URLs, in episode order (ep1,ep2,ep3...)"
        required: true
        type: string
      sub_type:
        description: "english or sinhala"
        required: true
        type: string
      chat_id:
        description: "Telegram chat_id to notify when done"
        required: true
        type: string
      tmdb_id:
        description: "TMDB show ID"
        required: true
        type: string
      season_number:
        description: "Season number"
        required: true
        type: string
      quality:
        description: "Video quality label (1080p, 720p, 540p, 480p)"
        required: false
        type: string
        default: "1080p"
      sub_format:
        description: "Subtitle format uploaded: srt or ass"
        required: false
        type: string
        default: "srt"

jobs:
  burn_batch:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - name: Checkout repo (for scripts)
        uses: actions/checkout@v4

      - name: Install ffmpeg, Sinhala font (Noto Sans Sinhala), p7zip
        run: |
          set -e
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg p7zip-full unzip
          pip install --quiet fonttools
          mkdir -p sinhala-font
          python scripts/install_sinhala_font.py sinhala-font
          if ! file sinhala-font/NotoSansSinhala-Bold.ttf | grep -qE "TrueType|OpenType"; then
            echo "ERROR: Font generation failed or file is not a valid font"
            exit 1
          fi
          mkdir -p /usr/share/fonts/truetype/custom
          sudo cp sinhala-font/NotoSansSinhala-Bold.ttf /usr/share/fonts/truetype/custom/
          sudo fc-cache -f
          echo "SINHALA_FONT_PATH=sinhala-font/NotoSansSinhala-Bold.ttf" >> "$GITHUB_ENV"
          echo "SINHALA_FONT_NAME=Noto Sans Sinhala" >> "$GITHUB_ENV"

      - name: Set up Python deps
        run: |
          pip install --quiet google-generativeai google-api-python-client google-auth requests Pillow

      - name: Download archive
        run: |
          set -e
          URL="${{ inputs.archive_url }}"
          if echo "$URL" | grep -q "pixeldrain.com/u/"; then
            FILE_ID=$(echo "$URL" | sed -E 's#.*pixeldrain\.com/u/([a-zA-Z0-9]+).*#\1#')
            URL="https://pixeldrain.com/api/file/${FILE_ID}"
          fi
          curl -f -L -A "Mozilla/5.0" -e "https://pixeldrain.com/" -o archive_file "$URL"
          ls -lh archive_file
          file archive_file

      - name: Extract archive
        run: |
          set -e
          mkdir -p extracted
          FILE_TYPE=$(file -b archive_file)
          echo "Detected type: $FILE_TYPE"
          if echo "$FILE_TYPE" | grep -qi "7-zip"; then
            7z x archive_file -oextracted -y
          elif echo "$FILE_TYPE" | grep -qi "zip"; then
            unzip -o archive_file -d extracted
          else
            echo "Trying 7z as fallback (handles most archive types)"
            7z x archive_file -oextracted -y
          fi
          echo "--- Extracted files ---"
          find extracted -type f \( -iname "*.mp4" -o -iname "*.mkv" -o -iname "*.avi" -o -iname "*.webm" \)

      - name: Discover episodes and build ordered list
        id: discover
        run: |
          set -e
          python3 << 'PYEOF'
          import os, re, json

          video_files = []
          for root, dirs, files in os.walk("extracted"):
              for f in files:
                  if f.lower().endswith((".mp4", ".mkv", ".avi", ".webm")):
                      video_files.append(os.path.join(root, f))

          episodes = []
          for path in video_files:
              filename = os.path.basename(path)
              match = re.search(r'[Ss]\d+[Ee](\d+)', filename)
              if match:
                  ep_num = int(match.group(1))
                  episodes.append({"episode": ep_num, "path": path})

          episodes.sort(key=lambda x: x["episode"])

          print(f"Discovered {len(episodes)} episodes:")
          for e in episodes:
              print(f"  Episode {e['episode']}: {e['path']}")

          with open("episodes_list.json", "w") as f:
              json.dump(episodes, f)
          PYEOF
          cat episodes_list.json

      - name: Process episodes sequentially (burn, upload, notify)
        env:
          GEMINI_API_KEY_1: ${{ secrets.GEMINI_API_KEY_1 }}
          GEMINI_API_KEY_2: ${{ secrets.GEMINI_API_KEY_2 }}
          GEMINI_API_KEY_3: ${{ secrets.GEMINI_API_KEY_3 }}
          GEMINI_API_KEY_4: ${{ secrets.GEMINI_API_KEY_4 }}
          GEMINI_API_KEY_5: ${{ secrets.GEMINI_API_KEY_5 }}
          GDRIVE_SA_JSON_B64: ${{ secrets.GDRIVE_SA_JSON_B64 }}
          GDRIVE_FOLDER_ID: ${{ secrets.GDRIVE_FOLDER_ID }}
          PIXELDRAIN_API_KEY: ${{ secrets.PIXELDRAIN_API_KEY }}
          VOE_API_KEY: ${{ secrets.VOE_API_KEY }}
          WEBHOOK_SECRET: ${{ secrets.WEBHOOK_SECRET }}
          BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CHAT_ID: ${{ inputs.chat_id }}
          TMDB_ID: ${{ inputs.tmdb_id }}
          SEASON_NUMBER: ${{ inputs.season_number }}
          SUB_TYPE: ${{ inputs.sub_type }}
          QUALITY: ${{ inputs.quality }}
          SRT_URLS_RAW: ${{ inputs.srt_urls }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          set -e

          IFS=',' read -ra SRT_ARRAY <<< "$SRT_URLS_RAW"

          python3 << 'PYEOF' > episode_count.txt
          import json
          with open("episodes_list.json") as f:
              episodes = json.load(f)
          print(len(episodes))
          PYEOF
          EP_COUNT=$(cat episode_count.txt)
          echo "Total episodes to process: $EP_COUNT (quality: $QUALITY)"

          # Fetch render settings once (same quality for the whole batch run)
          curl -s "${SUPABASE_URL}/rest/v1/render_settings?quality=eq.${QUALITY}&select=*" \
            -H "apikey: ${SUPABASE_SERVICE_ROLE_KEY}" \
            -H "Authorization: Bearer ${SUPABASE_SERVICE_ROLE_KEY}" \
            -o /tmp/render_settings.json

          python3 scripts/parse_render_settings.py /tmp/render_settings.json >> "$GITHUB_ENV"
          source "$GITHUB_ENV"
          echo "Render settings loaded: font=$RENDER_FONT_SIZE crf=$RENDER_CRF"

          FAILED_EPISODES=""

          for i in $(seq 0 $((EP_COUNT - 1))); do
            EP_INFO=$(python3 -c "import json; d=json.load(open('episodes_list.json')); print(json.dumps(d[$i]))")
            EP_NUM=$(echo "$EP_INFO" | python3 -c "import sys,json; print(json.load(sys.stdin)['episode'])")
            EP_PATH=$(echo "$EP_INFO" | python3 -c "import sys,json; print(json.load(sys.stdin)['path'])")

            echo "=================================================="
            echo "Processing Episode $EP_NUM ($EP_PATH) - Quality: $QUALITY"
            echo "=================================================="

            SRT_URL="${SRT_ARRAY[$i]}"
            if [ -z "$SRT_URL" ]; then
              echo "WARNING: No srt URL for episode $EP_NUM, skipping."
              FAILED_EPISODES="${FAILED_EPISODES} ${EP_NUM}(no-srt)"
              curl -s -X POST "https://api.telegram.org/bot${BOT_TOKEN}/sendMessage" \
                -d chat_id="${CHAT_ID}" \
                --data-urlencode text="⚠️ Episode ${EP_NUM} skipped: no subtitle URL provided."
              continue
            fi

            # Everything below runs in a subshell with its own 'set -e' so a
            # failure anywhere in THIS episode (bad srt link, download error,
            # ffmpeg crash, VOE quota, etc.) only aborts this one episode -
            # it can no longer kill the outer loop / the rest of the season.
            (
              set -e

              curl -f -L -o "subs_raw_ep${EP_NUM}.srt" "$SRT_URL"

              if [ "$SUB_TYPE" == "english" ]; then
                python scripts/translate.py "subs_raw_ep${EP_NUM}.srt" "subs_ep${EP_NUM}.srt"
              else
                python scripts/clean_srt.py "subs_raw_ep${EP_NUM}.srt" "subs_ep${EP_NUM}.srt"
              fi

              cp "$EP_PATH" "input_video_ep${EP_NUM}.mp4" || cp "$EP_PATH" "input_video_ep${EP_NUM}.mkv"
              INPUT_FILE=$(ls input_video_ep${EP_NUM}.* | head -1)

              # Robust pixel-based auto-crop (same detector used by burn.yml) -
              # replaces the old cropdetect/-t 30/tail -1 logic which only
              # checked the first 30s and could be fooled by burnt-in subtitle
              # text, missing black bars that only became stable later in the
              # episode.
              CROP=$(python3 scripts/detect_crop.py "$INPUT_FILE" --threshold 24 --samples 30 | grep "^crop=" || true)
              if [ -z "$CROP" ]; then
                echo "Episode $EP_NUM: no reliable crop detected, using full frame."
                CROP_FILTER=""
              else
                echo "Episode $EP_NUM: detected $CROP"
                CROP_FILTER="${CROP},"
              fi

              WATERMARK_TEXT="${RENDER_WATERMARK_TEXT}"
              FONT_DIR=$(pwd)/sinhala-font
              python scripts/srt_to_ass.py "subs_ep${EP_NUM}.srt" "subs_ep${EP_NUM}.ass" "$SINHALA_FONT_NAME" \
                --font-size "$RENDER_FONT_SIZE" --margin-v "$RENDER_MARGIN_V" --outline "$RENDER_OUTLINE"
              FILTER="${CROP_FILTER}ass=subs_ep${EP_NUM}.ass:fontsdir=${FONT_DIR},"
              FILTER="${FILTER}drawtext=text='${WATERMARK_TEXT}':fontfile=${SINHALA_FONT_PATH}:fontsize=${RENDER_WATERMARK_FONTSIZE}:fontcolor=white@${RENDER_WATERMARK_OPACITY}:borderw=1:bordercolor=black@0.5:x=w-tw-16:y=h-th-16"
              ffmpeg -y -i "$INPUT_FILE" \
                -vf "$FILTER" \
                -c:v libx264 -preset veryfast -crf "${RENDER_CRF}" -pix_fmt yuv420p \
                -c:a aac -b:a "${RENDER_AUDIO_BITRATE}" \
                -movflags +faststart \
                "output_ep${EP_NUM}.mp4"

              echo "Uploading Episode $EP_NUM to Pixeldrain..."
              python scripts/upload_pixeldrain.py "output_ep${EP_NUM}.mp4"
              PIXELDRAIN_LINK=$(cat pixeldrain_link.txt)
              echo "Pixeldrain link: $PIXELDRAIN_LINK"

              echo "Uploading Episode $EP_NUM to VOE.sx..."
              VOE_LINK=""
              RESPONSE=$(curl -s "https://voe.sx/api/upload/url?key=${VOE_API_KEY}&url=${PIXELDRAIN_LINK}")
              QUEUE_ID=$(echo "$RESPONSE" | python3 -c "import sys,json; print(json.load(sys.stdin).get('result',{}).get('queueID',''))" 2>/dev/null || echo "")

              if [ -n "$QUEUE_ID" ]; then
                for attempt in $(seq 1 90); do
                  sleep 10
                  STATUS=$(curl -s "https://voe.sx/api/upload/url/list?key=${VOE_API_KEY}&id=${QUEUE_ID}")
                  PERCENT=$(echo "$STATUS" | python3 -c "import sys,json; d=json.load(sys.stdin); print(d['list']['data'][0].get('percent', 0))" 2>/dev/null || echo "0")
                  FILE_CODE=$(echo "$STATUS" | python3 -c "import sys,json; d=json.load(sys.stdin); print(d['list']['data'][0].get('file_code', ''))" 2>/dev/null || echo "")
                  if [ "$PERCENT" = "100" ]; then
                    VOE_LINK="https://voe.sx/e/${FILE_CODE}"
                    echo "VOE embed link ready: $VOE_LINK"
                    break
                  fi
                done
              else
                echo "WARNING: VOE upload could not be queued (bad response: $RESPONSE), continuing without VOE link."
              fi

              echo "Notifying website for Episode $EP_NUM..."
              curl -s -X POST "https://onlyksub.vercel.app/api/webhook-hardcode-complete" \
                -H "Content-Type: application/json" \
                -H "x-webhook-secret: ${WEBHOOK_SECRET}" \
                -d "{
                  \"tmdb_id\": ${TMDB_ID},
                  \"season_number\": ${SEASON_NUMBER},
                  \"episode_number\": ${EP_NUM},
                  \"pixeldrain_download_url\": \"${PIXELDRAIN_LINK}\",
                  \"voe_embed_url\": \"${VOE_LINK}\",
                  \"quality\": \"${QUALITY}\"
                }"

              curl -s -X POST "https://api.telegram.org/bot${BOT_TOKEN}/sendMessage" \
                -d chat_id="${CHAT_ID}" \
                --data-urlencode text="✅ Episode ${EP_NUM} done (${QUALITY})! Pixeldrain: ${PIXELDRAIN_LINK}"

              echo "Episode $EP_NUM complete."
            )
            EP_STATUS=$?

            if [ $EP_STATUS -ne 0 ]; then
              echo "ERROR: Episode $EP_NUM failed (exit $EP_STATUS) - moving on to the next episode."
              FAILED_EPISODES="${FAILED_EPISODES} ${EP_NUM}"
              curl -s -X POST "https://api.telegram.org/bot${BOT_TOKEN}/sendMessage" \
                -d chat_id="${CHAT_ID}" \
                --data-urlencode text="❌ Episode ${EP_NUM} failed - check the GitHub Actions log. Continuing with the rest of the season."
            fi

            rm -f "input_video_ep${EP_NUM}".* "output_ep${EP_NUM}.mp4" "overlay_ep${EP_NUM}.mov"
          done

          if [ -n "$FAILED_EPISODES" ]; then
            echo "Episodes with problems:$FAILED_EPISODES"
            echo "FAILED_EPISODES=$FAILED_EPISODES" >> "$GITHUB_ENV"
          fi

      - name: Final notification
        if: always()
        env:
          BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CHAT_ID: ${{ inputs.chat_id }}
        run: |
          curl -s -X POST "https://api.telegram.org/bot${BOT_TOKEN}/sendMessage" \
            -d chat_id="${CHAT_ID}" \
            --data-urlencode text="🎉 Batch processing complete for the whole season!"