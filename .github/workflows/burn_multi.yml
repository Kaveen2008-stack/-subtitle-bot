name: Burn Subtitles (Multi-Quality Single Pass)

on:
  workflow_dispatch:
    inputs:
      video_url:
        description: "Direct/Pixeldrain video URL (should be the best available quality, e.g. 1080p source)"
        required: true
        type: string
      srt_url:
        description: "Raw URL to the .srt file (gist)"
        required: true
        type: string
      sub_type:
        description: "english or sinhala"
        required: true
        type: string
      chat_id:
        description: "Telegram chat_id to notify when done"
        required: true
        type: string
      tmdb_id:
        description: "TMDB show ID"
        required: true
        type: string
      season_number:
        description: "Season number"
        required: true
        type: string
      episode_number:
        description: "Episode number"
        required: true
        type: string
      sub_format:
        description: "Subtitle format uploaded: srt or ass"
        required: false
        type: string
        default: "srt"
      job_id:
        description: "Supabase job UUID (for dashboard tracking)"
        required: false
        type: string

concurrency:
  group: burn-multi-${{ inputs.chat_id }}-${{ inputs.tmdb_id }}-${{ inputs.episode_number }}
  cancel-in-progress: false

jobs:
  burn:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ inputs.chat_id }}
      JOB_ID: ${{ inputs.job_id }}
    steps:
      - name: Checkout repo (for scripts)
        uses: actions/checkout@v4

      - name: Install ffmpeg and Sinhala font (Noto Sans Sinhala)
        run: |
          set -e
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg
          mkdir -p sinhala-font
          curl -f -L -o sinhala-font/NotoSansSinhala-Bold.ttf \
            "https://github.com/google/fonts/raw/main/ofl/notosanssinhala/NotoSansSinhala%5Bwdth%2Cwght%5D.ttf"
          if ! file sinhala-font/NotoSansSinhala-Bold.ttf | grep -qE "TrueType|OpenType"; then
            echo "ERROR: Font download failed or file is not a valid font"
            exit 1
          fi
          mkdir -p /usr/share/fonts/truetype/custom
          sudo cp sinhala-font/NotoSansSinhala-Bold.ttf /usr/share/fonts/truetype/custom/
          sudo fc-cache -f
          echo "SINHALA_FONT_PATH=sinhala-font/NotoSansSinhala-Bold.ttf" >> "$GITHUB_ENV"
          echo "SINHALA_FONT_NAME=Noto Sans Sinhala" >> "$GITHUB_ENV"
          chmod +x scripts/report_status.sh

      - name: Set up Python deps
        run: |
          pip install --quiet google-generativeai google-api-python-client google-auth requests Pillow

      - name: Download subtitle file
        run: |
          set -e
          EXT="${{ inputs.sub_format }}"
          if [ -z "$EXT" ]; then EXT="srt"; fi
          curl -L -o "subs_raw.${EXT}" "${{ inputs.srt_url }}"

      - name: Clean subtitle (strip site credits/font tags - runs BEFORE translation)
        if: inputs.sub_format != 'ass'
        run: python scripts/clean_srt.py subs_raw.srt subs_cleaned.srt

      - name: Translate to Sinhala (only if needed, after cleaning)
        if: inputs.sub_type == 'english' && inputs.sub_format != 'ass'
        env:
          GEMINI_API_KEY_1: ${{ secrets.GEMINI_API_KEY_1 }}
          GEMINI_API_KEY_2: ${{ secrets.GEMINI_API_KEY_2 }}
          GEMINI_API_KEY_3: ${{ secrets.GEMINI_API_KEY_3 }}
          GEMINI_API_KEY_4: ${{ secrets.GEMINI_API_KEY_4 }}
          GEMINI_API_KEY_5: ${{ secrets.GEMINI_API_KEY_5 }}
        run: |
          ./scripts/report_status.sh "translate" "started"
          python scripts/translate.py subs_cleaned.srt subs.srt \
            && ./scripts/report_status.sh "translate" "success" \
            || { ./scripts/report_status.sh "translate" "failed"; exit 1; }

      - name: Use cleaned sub as-is (already Sinhala, no translation needed)
        if: inputs.sub_type != 'english' && inputs.sub_format != 'ass'
        run: cp subs_cleaned.srt subs.srt

      - name: Use ASS as-is (skip translation/conversion)
        if: inputs.sub_format == 'ass'
        run: cp subs_raw.ass subs.ass

      - name: Download video
        run: |
          set -e
          ./scripts/report_status.sh "download" "started"
          URL="${{ inputs.video_url }}"
          if echo "$URL" | grep -q "pixeldrain.com/u/"; then
            FILE_ID=$(echo "$URL" | sed -E 's#.*pixeldrain\.com/u/([a-zA-Z0-9]+).*#\1#')
            URL="https://pixeldrain.com/api/file/${FILE_ID}"
          fi
          if ! curl -f -L -A "Mozilla/5.0" -e "https://pixeldrain.com/" -o input_video.mp4 "$URL"; then
            ./scripts/report_status.sh "download" "failed" '{"reason":"curl download failed"}'
            exit 1
          fi
          ls -lh input_video.mp4
          file input_video.mp4
          if ! file input_video.mp4 | grep -qE "MP4|Matroska|ISO Media|WebM"; then
            ./scripts/report_status.sh "download" "failed" '{"reason":"not a valid video file"}'
            exit 1
          fi
          SIZE=$(du -h input_video.mp4 | cut -f1)
          ./scripts/report_status.sh "download" "success" "{\"size\":\"${SIZE}\"}"

      - name: Fetch render settings (for all 3 qualities)
        run: |
          set -e
          for Q in 1080p 720p 480p; do
            RESULT=$(curl -s "${SUPABASE_URL}/rest/v1/render_settings?quality=eq.${Q}&select=*" \
              -H "apikey: ${SUPABASE_SERVICE_ROLE_KEY}" \
              -H "Authorization: Bearer ${SUPABASE_SERVICE_ROLE_KEY}")
            python3 -c "
          import json, sys, os
          q = sys.argv[1].upper().replace('P', 'P')
          prefix = 'R_' + sys.argv[1].upper()
          try:
              rows = json.loads(sys.argv[2])
              if not rows:
                  raise ValueError('no settings row')
              s = rows[0]
          except Exception as e:
              print(f'WARNING: no render settings for {sys.argv[1]} ({e}), using defaults', file=sys.stderr)
              s = {}
          out = os.environ['GITHUB_ENV']
          with open(out, 'a') as f:
              f.write(f\"{prefix}_FONT_SIZE={s.get('font_size', 42)}\n\")
              f.write(f\"{prefix}_MARGIN_V={s.get('margin_v', 14)}\n\")
              f.write(f\"{prefix}_OUTLINE={s.get('outline_width', 1)}\n\")
              f.write(f\"{prefix}_WATERMARK_FONTSIZE={s.get('watermark_fontsize', 16)}\n\")
              f.write(f\"{prefix}_CRF={s.get('crf', 23)}\n\")
              f.write(f\"{prefix}_AUDIO_BITRATE={s.get('audio_bitrate', '128k')}\n\")
          " "$Q" "$RESULT"
          done
          # Shared (not per-quality) settings - taken from the 1080p row
          RESULT_1080=$(curl -s "${SUPABASE_URL}/rest/v1/render_settings?quality=eq.1080p&select=*" \
            -H "apikey: ${SUPABASE_SERVICE_ROLE_KEY}" \
            -H "Authorization: Bearer ${SUPABASE_SERVICE_ROLE_KEY}")
          python3 -c "
          import json, sys, os
          try:
              rows = json.loads(sys.argv[1])
              s = rows[0] if rows else {}
          except Exception:
              s = {}
          out = os.environ['GITHUB_ENV']
          with open(out, 'a') as f:
              f.write(f\"RENDER_WATERMARK_TEXT={s.get('watermark_text', 'OnlyKSub')}\n\")
              f.write(f\"RENDER_WATERMARK_OPACITY={s.get('watermark_opacity', 0.6)}\n\")
          " "$RESULT_1080"

      - name: Convert SRT to ASS (fixes Sinhala conjunct shaping in libass)
        if: inputs.sub_format != 'ass'
        run: |
          set -e
          python scripts/srt_to_ass.py subs.srt subs.ass "$SINHALA_FONT_NAME" \
            --font-size "$R_1080P_FONT_SIZE" \
            --margin-v "$R_1080P_MARGIN_V" \
            --outline "$R_1080P_OUTLINE"

      - name: Detect and remove black bars (robust pixel-based auto-crop)
        run: |
          set -e
          ./scripts/report_status.sh "crop_detect" "started"
          CROP=$(python3 scripts/detect_crop.py input_video.mp4 --threshold 24 --samples 30 | grep "^crop=" || true)
          if [ -z "$CROP" ]; then
            echo "CROP_FILTER=" >> "$GITHUB_ENV"
            ./scripts/report_status.sh "crop_detect" "success" '{"crop":"none - full frame used"}'
          else
            echo "Detected: $CROP"
            echo "CROP_FILTER=${CROP}," >> "$GITHUB_ENV"
            ./scripts/report_status.sh "crop_detect" "success" "{\"crop\":\"${CROP}\"}"
          fi

      - name: Burn subtitles + watermark for 3 qualities in ONE ffmpeg pass
        run: |
          set -e
          ./scripts/report_status.sh "burn" "started"
          FONT_DIR=$(pwd)/sinhala-font
          WATERMARK_TEXT="${RENDER_WATERMARK_TEXT}"

          # Same crop + subtitle burn applied to all 3 branches, only scale + bitrate differ.
          # split=3 duplicates the decoded frames once, so we only decode+crop+burn subs ONCE
          # and just re-scale + re-encode 3 times - much cheaper than 3 full separate runs.
          FILTER_COMPLEX="[0:v]${CROP_FILTER}ass=subs.ass:fontsdir=${FONT_DIR},split=3[v1][v2][v3]; \
          [v1]scale=1920:-2,drawtext=text='${WATERMARK_TEXT}':fontfile=${SINHALA_FONT_PATH}:fontsize=${R_1080P_WATERMARK_FONTSIZE}:fontcolor=white@${RENDER_WATERMARK_OPACITY}:borderw=1:bordercolor=black@0.5:x=w-tw-16:y=h-th-16[v1080]; \
          [v2]scale=1280:-2,drawtext=text='${WATERMARK_TEXT}':fontfile=${SINHALA_FONT_PATH}:fontsize=${R_720P_WATERMARK_FONTSIZE}:fontcolor=white@${RENDER_WATERMARK_OPACITY}:borderw=1:bordercolor=black@0.5:x=w-tw-16:y=h-th-16[v720]; \
          [v3]scale=854:-2,drawtext=text='${WATERMARK_TEXT}':fontfile=${SINHALA_FONT_PATH}:fontsize=${R_480P_WATERMARK_FONTSIZE}:fontcolor=white@${RENDER_WATERMARK_OPACITY}:borderw=1:bordercolor=black@0.5:x=w-tw-16:y=h-th-16[v480]"

          if ! ffmpeg -y -i input_video.mp4 \
            -filter_complex "$FILTER_COMPLEX" \
            -map "[v1080]" -map 0:a -c:v libx264 -preset veryfast -crf "${R_1080P_CRF}" -pix_fmt yuv420p -c:a aac -b:a "${R_1080P_AUDIO_BITRATE}" -movflags +faststart output_1080p.mp4 \
            -map "[v720]"  -map 0:a -c:v libx264 -preset veryfast -crf "${R_720P_CRF}"  -pix_fmt yuv420p -c:a aac -b:a "${R_720P_AUDIO_BITRATE}"  -movflags +faststart output_720p.mp4 \
            -map "[v480]"  -map 0:a -c:v libx264 -preset veryfast -crf "${R_480P_CRF}"  -pix_fmt yuv420p -c:a aac -b:a "${R_480P_AUDIO_BITRATE}"  -movflags +faststart output_480p.mp4; then
            ./scripts/report_status.sh "burn" "failed"
            exit 1
          fi

          echo "--- Outputs ---"
          for f in output_1080p.mp4 output_720p.mp4 output_480p.mp4; do
            ffprobe -v error -select_streams v:0 -show_entries stream=width,height -of csv=p=0 "$f"
            ls -lh "$f"
          done
          ./scripts/report_status.sh "burn" "success"

      - name: Upload all 3 qualities to Pixeldrain
        id: pixeldrain
        env:
          PIXELDRAIN_API_KEY: ${{ secrets.PIXELDRAIN_API_KEY }}
        run: |
          set -e
          ./scripts/report_status.sh "upload_pixeldrain" "started"
          declare -A LINKS
          for Q in 1080p 720p 480p; do
            echo "Uploading ${Q}..."
            if python scripts/upload_pixeldrain.py "output_${Q}.mp4"; then
              LINK=$(cat pixeldrain_link.txt)
              LINKS[$Q]="$LINK"
              echo "${Q} link: $LINK"
            else
              echo "WARNING: ${Q} upload failed"
              LINKS[$Q]=""
            fi
          done
          echo "link_1080p=${LINKS[1080p]}" >> "$GITHUB_OUTPUT"
          echo "link_720p=${LINKS[720p]}" >> "$GITHUB_OUTPUT"
          echo "link_480p=${LINKS[480p]}" >> "$GITHUB_OUTPUT"
          ./scripts/report_status.sh "upload_pixeldrain" "success" \
            "{\"1080p\":\"${LINKS[1080p]}\",\"720p\":\"${LINKS[720p]}\",\"480p\":\"${LINKS[480p]}\"}"

      - name: Notify website (webhook) - one call per quality
        if: always()
        continue-on-error: true
        env:
          WEBHOOK_SECRET: ${{ secrets.WEBHOOK_SECRET }}
          LINK_1080: ${{ steps.pixeldrain.outputs.link_1080p }}
          LINK_720: ${{ steps.pixeldrain.outputs.link_720p }}
          LINK_480: ${{ steps.pixeldrain.outputs.link_480p }}
        run: |
          ./scripts/report_status.sh "webhook_notify" "started"
          for PAIR in "1080p:$LINK_1080" "720p:$LINK_720" "480p:$LINK_480"; do
            Q="${PAIR%%:*}"
            LINK="${PAIR#*:}"
            if [ -z "$LINK" ]; then continue; fi
            curl -s -X POST "https://onlyksub.vercel.app/api/webhook-hardcode-complete" \
              -H "Content-Type: application/json" \
              -H "x-webhook-secret: ${WEBHOOK_SECRET}" \
              -d "{
                \"tmdb_id\": ${{ inputs.tmdb_id }},
                \"season_number\": ${{ inputs.season_number }},
                \"episode_number\": ${{ inputs.episode_number }},
                \"pixeldrain_download_url\": \"${LINK}\",
                \"quality\": \"${Q}\"
              }"
          done
          ./scripts/report_status.sh "webhook_notify" "success"

      - name: Mark job done in dashboard
        if: always()
        run: |
          if [ -n "$SUPABASE_URL" ] && [ -n "$JOB_ID" ]; then
            FINAL_STATUS="done"
            if [ "${{ job.status }}" != "success" ]; then FINAL_STATUS="failed"; fi
            curl -s -o /dev/null -X PATCH "${SUPABASE_URL}/rest/v1/jobs?id=eq.${JOB_ID}" \
              -H "apikey: ${SUPABASE_SERVICE_ROLE_KEY}" \
              -H "Authorization: Bearer ${SUPABASE_SERVICE_ROLE_KEY}" \
              -H "Content-Type: application/json" \
              -d "{\"status\":\"${FINAL_STATUS}\",\"finished_at\":\"$(date -u +%Y-%m-%dT%H:%M:%SZ)\",\"github_run_url\":\"${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}\",\"output_links\":{\"1080p\":\"${{ steps.pixeldrain.outputs.link_1080p }}\",\"720p\":\"${{ steps.pixeldrain.outputs.link_720p }}\",\"480p\":\"${{ steps.pixeldrain.outputs.link_480p }}\"}}" \
              || true
          fi

      - name: Notify on Telegram
        if: always()
        env:
          BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CHAT_ID: ${{ inputs.chat_id }}
          LINK_1080: ${{ steps.pixeldrain.outputs.link_1080p }}
          LINK_720: ${{ steps.pixeldrain.outputs.link_720p }}
          LINK_480: ${{ steps.pixeldrain.outputs.link_480p }}
        run: |
          TEXT="🎉 Done! (3 qualities, single pass)"$'\n'
          if [ -n "$LINK_1080" ]; then TEXT="${TEXT}"$'\n'"📥 1080p: ${LINK_1080}"; fi
          if [ -n "$LINK_720" ]; then TEXT="${TEXT}"$'\n'"📥 720p: ${LINK_720}"; fi
          if [ -n "$LINK_480" ]; then TEXT="${TEXT}"$'\n'"📥 480p: ${LINK_480}"; fi
          if [ -z "$LINK_1080" ] && [ -z "$LINK_720" ] && [ -z "$LINK_480" ]; then
            TEXT="❌ All uploads failed. Check the GitHub Actions log."
          fi
          curl -s -X POST "https://api.telegram.org/bot${BOT_TOKEN}/sendMessage" \
            -d chat_id="${CHAT_ID}" \
            --data-urlencode text="${TEXT}"

      - name: Upload artifacts (backup)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: burned-videos
          path: |
            output_1080p.mp4
            output_720p.mp4
            output_480p.mp4
          retention-days: 3